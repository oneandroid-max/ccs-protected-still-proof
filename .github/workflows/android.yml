# Builds the Android viewer on a GitHub-hosted runner (the Android SDK is downloaded from dl.google.com,
# which the authoring sandbox cannot reach) and replaces the APK in the rolling release "viewers", so its
# address never changes: https://github.com/oneandroid-max/ccs-protected-still-proof/releases/download/viewers/ccs-proof-viewer.apk
# Every number in the "Measure" step is printed by the command that produced it.
name: android viewer

on:
  push:
    branches: [main]
    paths: ["android/**", "tests/vectors/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain on this runner
        run: |
          java -version 2>&1 | head -1
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' '; echo

      - name: Cross-check the Java port against the test vector
        run: |
          S=$(sed -n 's/^secret=//p' tests/vectors/inputs.txt); P=$(sed -n 's/^pin=//p' tests/vectors/inputs.txt); H=$(sed -n 's/^hour=//p' tests/vectors/inputs.txt)
          mkdir -p /tmp/cc
          javac -d /tmp/cc android/app/src/main/java/com/candidcolor/proofviewer/ProofCrypto.java android/app/src/main/java/com/candidcolor/proofviewer/ProofMark.java android/tools/CrossCheck.java
          java -cp /tmp/cc CrossCheck tests/vectors/photo-test.enc "$S" "$P" "$H" --canonical | tee /tmp/java.txt
          diff /tmp/java.txt tests/vectors/expected.txt && echo "Java matches the vector"

      - name: Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Build the release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease

      - name: Measure the APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | sed -n '1,12p'
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$APK"

      - name: Replace the APK in the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ccs-proof-viewer.apk
          if ! gh release view viewers > /dev/null 2>&1; then
            gh release create viewers --latest \
              --title "CCS Proof Viewers (rolling)" \
              --notes "The latest build of every viewer; each workflow replaces its own asset in place. ccs-proof-viewer.apk: Android 8 or newer, sideload (open the file on the phone, allow installs from the browser when asked, install, then type the link key and the PIN). Build measurements are in the Actions logs."
          fi
          gh release upload viewers ccs-proof-viewer.apk --clobber
          echo "https://github.com/${{ github.repository }}/releases/download/viewers/ccs-proof-viewer.apk"
