# Measures the live Pages site from a GitHub runner (this sandbox cannot reach the Pages host): for
# each address, the HTTP status, the byte count and the first line, plus config.json as served.
# Started by hand or through the API; it changes nothing.
name: live check

on:
  workflow_dispatch:

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the live site's pages
        run: |
          B="https://oneandroid-max.github.io/ccs-protected-still-proof"
          for p in site/index.html site/setup.html site/view.html site/app.js site/crypto.js site/view-prelude.js site/config.json web/research/drm/index.html web/research/drm/card-widevine.mpd; do
            code=$(curl -sS -m 20 -o /tmp/body -w '%{http_code}' "$B/$p?v=$(date +%s)")
            printf '%s\t%s\t%s bytes\t%s\n' "$code" "$p" "$(wc -c < /tmp/body)" "$(head -c 120 /tmp/body | tr '\n' ' ')"
          done
          echo "--- config.json as served:"; curl -sS -m 20 "$B/site/config.json?v=$(date +%s)"; echo
      - name: The Apple files as served (status, content type, size), written as a notice on the run
        run: |
          B="https://oneandroid-max.github.io/ccs-protected-still-proof"
          out=""
          for p in web/research/apple/index.html web/research/drm/card-fairplay/master.m3u8 web/research/drm/card-fairplay/video.m3u8 web/research/drm/card-fairplay/video.mp4 web/research/drm/card-fairplay/info.json; do
            line=$(curl -sS -m 20 -o /tmp/body -w '%{http_code} %{content_type}' "$B/$p?v=$(date +%s)")
            out="$out$line $(wc -c < /tmp/body) bytes $p%0A"
          done
          ver=$(curl -sS -m 20 "$B/web/research/drm/?clip=card&v=$(date +%s)" | grep -o 'PAGE_VERSION = "[^"]*"' | head -1)
          key=$(curl -sS -m 20 "$B/web/research/drm/card-fairplay/video.m3u8?v=$(date +%s)" | grep -m1 '^#EXT-X-KEY' || echo "no key line")
          echo "::notice title=Apple files::$out$ver%0A$key"
      - name: The player library's integrity hash (for the pages' integrity attribute)
        run: |
          U="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/5.2.10/shaka-player.compiled.min.js"
          curl -sSL -m 30 -o /tmp/shaka.js "$U"
          printf 'bytes: %s\nsha384-%s\n' "$(wc -c < /tmp/shaka.js)" "$(openssl dgst -sha384 -binary /tmp/shaka.js | openssl base64 -A)"
