# Route 1's TEST CARD in Apple's FairPlay form (tools/fairplay-card.mjs): the same packaging code as the
# owner's pictures, under Axinom's PUBLIC test key, so a real iPhone, iPad or Mac can prove the packaging
# through Axinom's public licence token before any account exists. The tool decrypts its own output two
# independent ways (ffmpeg, shaka-packager) and fails unless both give back exactly the clear card.
# The card is public by design (anyone can decrypt it with the published key); no picture of the owner's
# is ever read here.
name: card fairplay

on:
  push:
    branches: [main]
    paths: [".github/workflows/card-fairplay.yml", "tools/fairplay-card.mjs"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg and shaka-packager
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && ffmpeg -version | head -1
          curl -sSL -o /usr/local/bin/packager https://github.com/shaka-project/shaka-packager/releases/download/v3.9.3/packager-linux-x64
          sudo chmod +x /usr/local/bin/packager && packager --version
      - name: Package the card for FairPlay, check it, decrypt it back two ways
        env: { PACKAGER_BIN: /usr/local/bin/packager }
        run: node tools/fairplay-card.mjs
      - name: Commit the card's FairPlay form
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/research/drm/card-fairplay
          if git diff --cached --quiet; then echo "card unchanged"; exit 0; fi
          git commit -m "research(apple): the test card in FairPlay form — our packaging, Axinom's public test key (run ${{ github.run_number }})"
          git pull --rebase origin main
          git push origin HEAD:main
