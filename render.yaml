# One-click hosting for the test site on Render (https://render.com/deploy?repo=https://github.com/oneandroid-max/ccs-protected-still-proof).
# Render asks for the one value marked sync: false (the site's password; the owner chose a password
# with no username) when the blueprint is applied, and generates the session secret itself. The
# password is never written in this repository. The disk keeps uploads across restarts and deploys; disks need a
# paid instance (starter), so the test site costs about $7 a month plus $0.25 per GB of disk.
services:
  - type: web
    name: ccs-proof-test
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./service/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PROOF_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
